<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#294c3b"><title>离线阅读 · LexiStory</title>
<style>body{margin:0;background:#f7f7f2;color:#273a30;font:16px/1.8 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:40px 24px}h1{font-size:30px;line-height:1.3}button,a{font:inherit;cursor:pointer;color:inherit}button{display:block;width:100%;text-align:left;border:1px solid #d9e1d5;background:#fffefa;border-radius:14px;padding:18px;margin:12px 0}article{white-space:pre-wrap;font:21px/1.9 Georgia,serif}small{color:#657365}a{display:inline-block;margin-top:24px}#back{width:auto;padding:8px 18px}</style></head>
<body><main><small>LEXISTORY · 离线也能读</small><h1 id="title">故事还在这里。</h1><p id="description">暂时无法连接网络。你可以继续阅读这台设备保存的文章；联网后再使用生成和云端朗读。</p><div id="list"></div><article id="content"></article><p id="translation"></p><button id="back" hidden>返回文章列表</button><a href="/">重新连接学习空间 →</a></main>
<script>
let articles=[];try{const saved=JSON.parse(localStorage.getItem('lexistory_articles')||'[]');if(Array.isArray(saved))articles=saved;}catch{}
const list=document.getElementById('list'),back=document.getElementById('back');
function showList(){list.replaceChildren();document.getElementById('title').textContent='故事还在这里。';document.getElementById('content').textContent='';document.getElementById('translation').textContent='';back.hidden=true;
if(!articles.length){const p=document.createElement('p');p.textContent='本机还没有保存的文章。恢复网络后，先体验一篇故事吧。';list.append(p);}
for(const article of articles){const button=document.createElement('button');button.textContent=article.title;button.onclick=()=>{list.replaceChildren();document.getElementById('title').textContent=article.title;document.getElementById('content').textContent=article.content;document.getElementById('translation').textContent=article.translation||'';back.hidden=false;window.scrollTo(0,0);};list.append(button);}}
back.onclick=showList;showList();
</script></body></html>
